        let currentTopicIndex = 0;

        function initApp() {
            const topicList = document.getElementById('topic-list');
            lessonData.forEach((topic, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <button class="w-full text-left px-5 py-4 hover:bg-blue-50 focus:outline-none transition flex items-center justify-between group ${index === 0 ? 'bg-blue-50 border-l-4 border-blue-600 font-semibold text-blue-700' : 'text-gray-600 border-l-4 border-transparent'}"
                            onclick="loadTopic(${index}, this)">
                        <span class="truncate">${topic.title}</span>
                        <i class="fa-solid fa-chevron-right text-xs opacity-0 group-hover:opacity-100 ${index === 0 ? 'opacity-100 text-blue-600' : 'text-gray-400'} transition-all ml-2"></i>
                    </button>`;
                topicList.appendChild(li);
            });
            loadTopic(0, topicList.querySelector('button'));
        }

        function loadTopic(index, btnElement) {
            currentTopicIndex = index;
            const topic = lessonData[index];
            
            if(btnElement) {
                document.querySelectorAll('#topic-list button').forEach(btn => {
                    btn.classList.remove('bg-blue-50', 'border-blue-600', 'font-semibold', 'text-blue-700');
                    btn.classList.add('border-transparent', 'text-gray-600');
                    btn.querySelector('i').classList.remove('opacity-100', 'text-blue-600');
                });
                btnElement.classList.add('bg-blue-50', 'border-blue-600', 'font-semibold', 'text-blue-700');
                btnElement.classList.remove('border-transparent', 'text-gray-600');
                btnElement.querySelector('i').classList.add('opacity-100', 'text-blue-600');
            }

            document.getElementById('current-topic-title').innerText = topic.title;

            // Load Vocab
            const vocabGrid = document.getElementById('vocab-grid');
            vocabGrid.innerHTML = '';
            topic.vocab.forEach((wordPair, idx) => {
                vocabGrid.innerHTML += `
                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-5 hover:shadow-md transition-shadow relative">
                        <div class="absolute -top-3 -left-3 bg-blue-100 text-blue-800 font-bold w-8 h-8 rounded-full flex items-center justify-center border-2 border-white shadow-sm">${idx + 1}</div>
                        <div class="flex justify-between items-start mt-2">
                            <div>
                                <h4 class="font-bold text-xl text-gray-800">${wordPair[0]}</h4>
                                <p class="text-blue-600 font-mono text-sm mt-1">${wordPair[2]}</p>
                                <p class="text-gray-600 mt-2">${wordPair[1]}</p>
                            </div>
                            <button onclick="speakWord('${wordPair[0].replace(/'/g, "\\'")}')" class="text-gray-400 hover:text-blue-600 hover:bg-blue-50 p-3 rounded-full transition cursor-pointer">
                                <i class="fa-solid fa-volume-high text-xl"></i>
                            </button>
                        </div>
                    </div>`;
            });

            // Load Exercises
            const exercisesContainer = document.getElementById('exercises-container');
            exercisesContainer.innerHTML = '';
            const levelsInfo = [
                { id: 1, title: "Mức 1: Cực Dễ", color: "text-green-600", bg: "bg-green-50", border: "border-green-200" },
                { id: 2, title: "Mức 2: Cơ Bản", color: "text-blue-600", bg: "bg-blue-50", border: "border-blue-200" },
                { id: 3, title: "Mức 3: Khá Khó", color: "text-orange-600", bg: "bg-orange-50", border: "border-orange-200" },
                { id: 4, title: "Mức 4: Khó", color: "text-red-600", bg: "bg-red-50", border: "border-red-200" }
            ];

            levelsInfo.forEach(lvl => {
                const levelExs = topic.exercises.filter(e => e[0] === lvl.id);
                if(levelExs.length === 0) return;

                let sectionHtml = `<div class="mb-10"><h4 class="text-lg font-bold ${lvl.color} mb-4 flex items-center gap-2 border-b pb-2"><i class="fa-solid fa-layer-group"></i> ${lvl.title}</h4><div class="space-y-4">`;
                levelExs.forEach(ex => {
                    const globalIdx = topic.exercises.indexOf(ex);
                    sectionHtml += `
                        <div class="border ${lvl.border} ${lvl.bg} rounded-lg p-5">
                            <p class="text-gray-800 font-medium text-[1.05rem] mb-3"><span class="font-bold text-gray-500 mr-1">${globalIdx + 1}.</span> ${ex[1]}</p>
                            <div class="flex flex-col sm:flex-row gap-3">
                                <input type="text" id="ex-input-${globalIdx}" class="flex-1 border border-gray-300 rounded-lg px-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-500" placeholder="Viết câu tiếng Anh của bạn tại đây...">
                                <button onclick="checkAnswer(${globalIdx}, '${ex[2].replace(/'/g, "\\'")}')" class="bg-blue-600 text-white px-6 py-2.5 rounded-lg font-semibold hover:bg-blue-700 shrink-0">Chấm điểm</button>
                            </div>
                            <div id="ex-result-${globalIdx}" class="mt-3 hidden text-sm font-medium p-3 rounded-lg border"></div>
                        </div>`;
                });
                sectionHtml += `</div></div>`;
                exercisesContainer.innerHTML += sectionHtml;
            });
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById('tab-vocab').classList.add('hidden');
            document.getElementById('tab-exercises').classList.add('hidden');
            document.getElementById('tab-' + tabId).classList.remove('hidden');
        }

        function speakWord(word) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.85; // Chậm hơn để người mới học dễ bắt nhịp
                window.speechSynthesis.speak(utterance);
            }
        }

        function checkAnswer(idx, correctAns) {
            const inputEl = document.getElementById(`ex-input-${idx}`);
            const resultEl = document.getElementById(`ex-result-${idx}`);
            const userAns = inputEl.value.trim();

            if(userAns === '') {
                resultEl.className = "mt-3 text-sm font-medium p-3 rounded-lg bg-yellow-50 text-yellow-700 border-yellow-200 block";
                resultEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1"></i> Vui lòng nhập câu trả lời.`;
                return;
            }

            const normalize = (str) => str.toLowerCase().replace(/[^a-z0-9]/g, '');
            if (normalize(userAns) === normalize(correctAns)) {
                resultEl.className = "mt-3 text-sm font-medium p-3 rounded-lg bg-green-50 text-green-700 border-green-200 block";
                resultEl.innerHTML = `<i class="fa-solid fa-circle-check mr-1 text-green-600"></i> <strong>Chính xác tuyệt đối!</strong>`;
            } else {
                resultEl.className = "mt-3 text-sm font-medium p-3 rounded-lg bg-red-50 text-red-700 border-red-200 block";
                resultEl.innerHTML = `<div class="flex items-start"><i class="fa-solid fa-circle-xmark mt-1 mr-2 text-red-600"></i><div><strong>Sai ngữ pháp hoặc từ vựng!</strong><br><span class="text-gray-600 mt-1 block">Đáp án mẫu: <span class="font-bold text-green-700 bg-green-100 px-1 rounded">${correctAns}</span></span></div></div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
